[metadata]
name = screening
version = 0.0.0
description = Defines screening functions for simulation
long_description = file: README.md
long_description_content_type = text/markdown
author = Nicholas Wood
author_email = nick.wood@cdrg.org
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python :: Implementation :: PyPy

[options]
py_modules = screening
install_requires =
    polars
    sim-utils@git+https://github.com/HHRI-Transplantation/sim-utils
python_requires = >=3.11

[bdist_wheel]
universal = True

[coverage:run]
plugins = covdefaults
parallel = true

[coverage:report]
fail_under = 100

[tool:pytest]
addopts = --cov=screening --cov-report html

[mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
